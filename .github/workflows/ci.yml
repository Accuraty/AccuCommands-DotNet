name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore AccuCommands.sln --locked-mode
      - name: Build Release
        run: dotnet build AccuCommands.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test AccuCommands.sln --configuration Release --no-build --no-restore
      - name: Pack CLI
        run: dotnet pack AccuCommands.csproj --configuration Release --no-build --no-restore --output artifacts/packages
